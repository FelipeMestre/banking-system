name: banking-system

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: banking-poc-cluster-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: bash -c "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic account-events --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic transfer-status --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic account-balances --partitions 6 --replication-factor 1 --config cleanup.policy=compact && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"

  flink-jobmanager:
    build:
      context: ./account-service
    image: banking-system/account-service:latest
    container_name: flink-jobmanager
    platform: linux/amd64
    command: jobmanager
    ports:
      - "8081:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 3
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_EVENTS_TOPIC: account-events
      TRANSFER_STATUS_TOPIC: transfer-status
      ACCOUNT_BALANCES_TOPIC: account-balances
      PROCESSED_IDS_TTL_DAYS: "7"
      CHECKPOINT_INTERVAL_MS: "5000"
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints

  flink-taskmanager:
    build:
      context: ./account-service
    image: banking-system/account-service:latest
    container_name: flink-taskmanager
    platform: linux/amd64
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 6
        parallelism.default: 3
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_EVENTS_TOPIC: account-events
      TRANSFER_STATUS_TOPIC: transfer-status
      ACCOUNT_BALANCES_TOPIC: account-balances
      PROCESSED_IDS_TTL_DAYS: "7"
      CHECKPOINT_INTERVAL_MS: "5000"
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints

  # One-shot submitter: pushes the PyFlink job to the cluster once it is up.
  flink-job-submitter:
    build:
      context: ./account-service
    image: banking-system/account-service:latest
    container_name: flink-job-submitter
    platform: linux/amd64
    restart: "no"
    depends_on:
      - flink-taskmanager
    environment:
      FLINK_JOBMANAGER: flink-jobmanager:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_EVENTS_TOPIC: account-events
      TRANSFER_STATUS_TOPIC: transfer-status
      ACCOUNT_BALANCES_TOPIC: account-balances
      PROCESSED_IDS_TTL_DAYS: "7"
      CHECKPOINT_INTERVAL_MS: "5000"
    command: ["/opt/account_service/submit.sh"]

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openbank
      POSTGRES_PASSWORD: openbank
      POSTGRES_DB: openbank
    # wal_level=logical so a future CDC feed (spec §2) can attach without a
    # restart. It costs a little WAL volume and nothing else here.
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Replayed exactly once, when the volume is empty. `down -v` re-runs it.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbank -d openbank"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Still named `gateway` per spec §10, though the package is now openbankapi.
  gateway:
    build:
      context: ./openbankapi
    container_name: gateway
    ports:
      - "8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_EVENTS_TOPIC: account-events
      TRANSFER_STATUS_TOPIC: transfer-status
      ACCOUNT_BALANCES_TOPIC: account-balances
      BALANCE_CONSUMER_GROUP: openbankapi-balances
      DATABASE_DSN: postgresql+asyncpg://openbank:openbank@postgres:5432/openbank
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
      CORS_ALLOW_ORIGINS: http://localhost:3000
      # A 16-digit number now: 'acc-fees' would fail the cuentas CHECK, and this
      # value is a Kafka partition key.
      FEES_ACCOUNT: "0000000000000001"
      FEE_FLAT_CENTS: "25"
      WEBSOCKET_TIMEOUT_SECONDS: "30"

  kafka-ui:
    image: tchiotludo/akhq:0.25.1
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            banking-local:
              properties:
                bootstrap.servers: "kafka:19092"

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  flink-checkpoints:
