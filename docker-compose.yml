name: banking-system

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: banking-poc-cluster-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: bash -c "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic account-events --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic transfer-status --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"

  flink-jobmanager:
    build:
      context: ./account-service
    image: banking-system/account-service:latest
    container_name: flink-jobmanager
    platform: linux/amd64
    command: jobmanager
    ports:
      - "8081:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 3
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_EVENTS_TOPIC: account-events
      TRANSFER_STATUS_TOPIC: transfer-status
      PROCESSED_IDS_TTL_DAYS: "7"
      CHECKPOINT_INTERVAL_MS: "5000"
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints

  flink-taskmanager:
    build:
      context: ./account-service
    image: banking-system/account-service:latest
    container_name: flink-taskmanager
    platform: linux/amd64
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 6
        parallelism.default: 3
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_EVENTS_TOPIC: account-events
      TRANSFER_STATUS_TOPIC: transfer-status
      PROCESSED_IDS_TTL_DAYS: "7"
      CHECKPOINT_INTERVAL_MS: "5000"
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints

  # One-shot submitter: pushes the PyFlink job to the cluster once it is up.
  flink-job-submitter:
    build:
      context: ./account-service
    image: banking-system/account-service:latest
    container_name: flink-job-submitter
    platform: linux/amd64
    restart: "no"
    depends_on:
      - flink-taskmanager
    environment:
      FLINK_JOBMANAGER: flink-jobmanager:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_EVENTS_TOPIC: account-events
      TRANSFER_STATUS_TOPIC: transfer-status
      PROCESSED_IDS_TTL_DAYS: "7"
      CHECKPOINT_INTERVAL_MS: "5000"
    command: ["/opt/account_service/submit.sh"]

  kafka-ui:
    image: tchiotludo/akhq:0.25.1
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            banking-local:
              properties:
                bootstrap.servers: "kafka:19092"

volumes:
  kafka-data:
  flink-checkpoints:
