# Load balances traffic across all `openbankapi` HTTP replicas (see
# docker-compose.yml's `openbankapi` service, scaled via `--scale
# openbankapi=N`). Plain round-robin is safe here specifically because the
# horizontal-scalability change made every replica able to resolve any
# request (Redis-backed StatusRegistry) — no sticky sessions needed.

resolver 127.0.0.11 valid=10s;

# Standard WebSocket-upgrade map: sets `Connection: upgrade` only when the
# client actually sent an `Upgrade` header, and `close` otherwise — setting
# `Connection: upgrade` unconditionally would break normal HTTP/1.1
# keep-alive on every non-WebSocket request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        # `openbankapi` is a Docker Compose service name backed by multiple
        # container IPs once scaled. Docker's embedded DNS (127.0.0.11)
        # round-robins across them on each lookup. Referencing the upstream
        # through a variable (not a bare hostname in proxy_pass) forces
        # nginx to re-resolve per the `resolver valid=10s` above instead of
        # caching the IP set once at startup — required for replicas that
        # come and go (restarts, rescale) to be picked up without reloading
        # nginx.
        set $openbankapi_upstream openbankapi:8000;
        proxy_pass http://$openbankapi_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — /ws/transfer/{id}, /ws/purchases/{id}, etc.
        # depend on this; without it the upgrade handshake fails and those
        # endpoints break silently behind the proxy.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
